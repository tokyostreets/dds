[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dds-etl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.8.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*"]
exclude = ["db*", "dags*"]